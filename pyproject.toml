[project]
name = "asset-management"
version = "0.1.0"
description = "個人資産管理アプリ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.36.0",
    "plotly>=5.22.0",
    "pandas>=2.0.0",
    "yfinance>=0.2.50",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pandas-stubs>=3.0.0.260204",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]
